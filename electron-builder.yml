# 必须在项目根目录执行 electron-builder（npm run dist:win），以便正确解析 frontend/dist、backend/extraResources 等路径。
# Windows 变体配置文件（均 extends 本文件或 win7 基座）：
#   electron-builder.win.no-ai.yml / electron-builder.win.qwen.yml
#   electron-builder.win7.yml + electron-builder.win7.no-ai.yml / electron-builder.win7.qwen.yml
appId: com.changsha.pipeline.calc
productName: CINF长沙院浆体计算软件
copyright: Copyright © 2026 长沙有色冶金设计研究院有限公司

# 安装包/更新用文件名：仅 ASCII，避免 GitHub 网页拖入 Release 时剥掉中文导致与 latest.yml 不一致（界面仍用中文 productName）

directories:
  buildResources: electron/build
  output: release

# 自动更新：GitHub Releases（拉取 .atom / latest.yml 与安装包资产）
# 版本号：根 package.json 的 "version" 与发版时一致；发版前升版本再 build。
# 发布到 GitHub（本机/CI）：需 GH_TOKEN，例如  npx electron-builder --win --publish always
#
# 重要：github.com/owner/repo/releases 若对「未登录用户」是 404（常见为私有库），
# electron-updater 的匿名检查也会 404。公网用户能用的做法是其一：
#   A) 将仓库改为 Public，或
#   B) 另建一个「仅发安装包+latest.yml 的 Public 空仓库」，把下面 owner/repo 改成它。
# 内网可给运行环境设 GH_TOKEN（勿写入安装包分发给公网）。
# 大陆网络不稳时可改为 generic，把 yml+exe 放到国内可访问的静态站。
publish:
  provider: github
  owner: l4ii
  repo: CINF_Flow_Calculator

# 前端打进 app.asar（frontend/dist → asar 内 frontend/dist），减少安装目录 resources 下的明文脚本；仍为安装即替换整份 asar，避免旧缓存。
files:
  - electron/**
  - from: frontend/dist
    to: frontend/dist
    filter:
      - "**/*"
  # backend 仅在 extraResources → resources/backend；若再打進 app.asar 会与 resources 内 backend.exe/GGUF 整份重复（体积接近翻倍）
  - "!backend/**"
  - requirements.txt
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icon.ico
  artifactName: CINF-FlowCalc-${version}-${arch}.${ext}
  requestedExecutionLevel: asInvoker
  # 正式公网分发应配置 Windows 代码签名证书（如 CSC_LINK/CSC_KEY_PASSWORD 或系统证书）。
  # 不再关闭更新签名校验；未签名更新包会被拒绝，避免被替换的安装包静默安装。
  verifyUpdateCodeSignature: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  license: LICENSE.nsis.txt
  menuCategory: false
  displayLanguageSelector: false
  include: electron/build/installer.nsh
  warningsAsErrors: false
  # 辅助安装程序完成页显示「运行 xxx」复选框（默认勾选）；false 会隐藏该选项且安装结束后不启动应用
  runAfterFinish: true
  # 不请求管理员权限；installer.nsh 中通过 customInstallMode 强制仅当前用户并跳过选择页，避免 UAC 导致安装程序重启、许可证页出现两次
  allowElevation: false
  perMachine: false
  selectPerMachineByDefault: false

mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  # icon: icon.icns  # 暂时注释，等准备好 icon.icns 放入 electron/build 后再启用
  category: public.app-category.utilities
  artifactName: CINF-FlowCalc-${version}-${arch}.${ext}

dmg:
  title: ${productName} ${version}
  # icon: icon.icns  # 暂时注释，等准备好 icon.icns 放入 electron/build 后再启用
  contents:
    - x: 130
      y: 220
    - x: 410
      y: 220
      type: link
      path: /Applications

linux:
  target:
    - AppImage
    - deb
  icon: icon.png
  category: Utility
  artifactName: CINF-FlowCalc-${version}-${arch}.${ext}

appImage:
  artifactName: CINF-FlowCalc-${version}-${arch}.AppImage

deb:
  depends:
    - python3
    - python3-pip

extraResources:
  # 安装包图标等（打包后运行时窗口图标从 resources/build 读取）
  - from: electron/build
    to: build
  # 仅打包可执行文件与数据目录，不包含 .py 源码（运行时以 PyInstaller backend.exe 提供功能）
  - from: backend
    to: backend
    filter:
      - "**/*.exe"
      - "**/dist/**"
      - "**/assistant_knowledge/**/*.txt"
      - "**/assistant_knowledge/**/*.md"
      - "!python38/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/build/**"
      - "!**/*.spec"
      - "!**/build_backend.py"
  # 助手 GGUF：构建前由 npm 脚本运行 scripts/stage-pack-resources.js 写入（绕过 .gitignore）
  - from: build/pack-resources/backend/models
    to: backend/models
    filter:
      - "**/*.gguf"
  - from: requirements.txt
    to: requirements.txt
