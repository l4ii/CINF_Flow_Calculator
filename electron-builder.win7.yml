# Win7/8 兼容版打包配置：输出到 release-win7；安装包文件名为 ASCII（见主 yml 说明）
# 需配合 Electron 22 使用（npm run dist:win:legacy）
appId: com.changsha.pipeline.calc
productName: CINF长沙院浆体计算软件
copyright: Copyright © 2026 长沙有色冶金设计研究院有限公司

directories:
  buildResources: electron/build
  output: release-win7

files:
  - electron/**
  - backend/**
  - "!backend/python38/**"
  - requirements_win7.txt
  - package.json
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"
  - "!**/*.{iml,o,hprof,orig,pyc,pyo,rbc,swp,csproj,sln,xproj}"
  - "!.editorconfig"
  - "!**/._*"
  - "!**/{.DS_Store,.git,.hg,.svn,CVS,RCS,SCCS,.gitignore,.gitattributes}"
  - "!**/{__pycache__,thumbs.db,.flowconfig,.idea,.vs,.nyc_output}"
  - "!**/{appveyor.yml,.travis.yml,circle.yml}"
  - "!**/{npm-debug.log,yarn.lock,.yarn-integrity,.yarn-metadata.json}"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: icon.ico
  artifactName: CINF-FlowCalc-${version}-${arch}-Win7.${ext}
  requestedExecutionLevel: asInvoker
  # 正式公网分发应配置 Windows 代码签名证书；未签名更新包会被拒绝。
  verifyUpdateCodeSignature: true

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: ${productName}
  installerIcon: icon.ico
  uninstallerIcon: icon.ico
  installerHeaderIcon: icon.ico
  license: LICENSE.nsis.txt
  menuCategory: false
  displayLanguageSelector: false
  include: electron/build/installer.nsh
  warningsAsErrors: false
  # 完成页「运行应用」复选框（默认可取消勾选）；false 则隐藏该选项
  runAfterFinish: true
  allowElevation: false
  perMachine: false
  selectPerMachineByDefault: false

publish:
  provider: github
  owner: l4ii
  repo: CINF_Flow_Calculator
  channel: win7

extraResources:
  - from: frontend/dist
    to: frontend-dist
  - from: electron/build
    to: build
  - from: backend
    to: backend
    filter:
      - "**/*.py"
      - "**/*.exe"
      - "**/dist/**"
      - "!**/__pycache__/**"
      - "!**/*.pyc"
      - "!**/build/**"
      - "!**/*.spec"
      - "!**/build_backend.py"
  # 内置 Python 3.8（Win7 兼容），若无此文件夹则跳过
  - from: backend/python38
    to: backend/python38
    filter: ["**/*"]
  - from: requirements_win7.txt
    to: requirements_win7.txt
